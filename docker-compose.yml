version: '3.8'

services:
  spic-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spic-ai
    ports:
      - "8190:8190"
    environment:
      - TZ=Asia/Shanghai
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8190/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


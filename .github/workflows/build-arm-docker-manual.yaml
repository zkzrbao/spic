name: Build ARM Image & Upload to Release (Manual Only)

# 仅支持手动触发
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 标签名称 (例如: v1.0.0-arm64)'
        required: true
        default: 'v1.0.0-arm64'
      release_name:
        description: 'Release 名称'
        required: true
        default: 'ARM64 Image Build'
      release_body:
        description: 'Release 描述信息'
        required: false
        default: 'Automatically built ARM64 Docker image tar package'

permissions:
  contents: write
  packages: read

jobs:
  build-arm-image:
    runs-on: ubuntu-latest
    steps:
      # 步骤1：拉取仓库代码
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 步骤2：创建输出目录（避免tar包保存失败）
      - name: Create Output Directory
        run: mkdir -p ./docker-image

      # 步骤3：安装QEMU，支持ARM架构模拟
      - name: Set up QEMU Emulator
        uses: docker/setup-qemu-action@v3

      # 步骤4：配置Docker Buildx，支持跨架构构建
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 步骤5：构建ARM64镜像并导出为tar包
      - name: Build ARM64 Image & Export to Tar
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: spic-ai:arm64-latest
          outputs: type=docker,dest=./docker-image/spic-ai-arm64.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 步骤6：创建GitHub Release
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_name }}
          body: ${{ github.event.inputs.release_body }}
          draft: false
          prerelease: false
          files: ./docker-image/spic-ai-arm64.tar

      # 步骤7：输出Release信息（便于查看）
      - name: Output Release URL
        run: echo "Release created at ${{ steps.create_release.outputs.url }}"
